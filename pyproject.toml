[project]
name = "skill-eval-service"
version = "0.1.0"
description = "Skill 评测服务 — 基于 SkillEvaluator 的 Tier 1 评测编排与结果服务"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
# 契约测试用。基础安装（无 extras）很轻，只有 click/pydantic/pyyaml/rich 等，
# 不会把 litellm、harbor 拉进来。真正执行评测的 skillevaluator 仍是独立安装
# 的 CLI，见 README。
# 跑 PostgreSQL 版测试用。生产部署也需要它。
pg = [
    "psycopg[binary]>=3.2",
]
contract = [
    "skillevaluator @ git+https://github.com/NVIDIA/SkillEvaluator.git",
]

[project.scripts]
skill-eval-worker = "skill_eval_service.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: 端到端集成测试，需要 skillevaluator CLI 与外部扫描器（缺失时自动跳过）",
]
